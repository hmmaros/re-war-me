<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="ReWarMe hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04160e"/>
      <stop offset="0.55" stop-color="#07291b"/>
      <stop offset="1" stop-color="#063a25"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34d399" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <circle cx="640" cy="168" r="150" fill="url(#glow)"/>

  <!-- icon: WAR cube with deploy cycle -->
  <g transform="translate(640,168)">
    <path d="M -34 -30 A 60 60 0 0 1 30 -36" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/>
    <path d="M 30 -36 L 34 -24 L 20 -30 Z" fill="#6ee7b7"/>
    <path d="M 34 30 A 60 60 0 0 1 -30 36" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <path d="M -30 36 L -34 24 L -20 30 Z" fill="#10b981"/>
    <rect x="-58" y="-63" width="116" height="116" rx="20" fill="url(#box)" stroke="#a7f3d0" stroke-width="3"/>
    <text x="0" y="-6" text-anchor="middle" font-family="monospace" font-size="42" font-weight="bold" fill="#052e16">WAR</text>
    <text x="0" y="28" text-anchor="middle" font-family="monospace" font-size="16" fill="#065f46">.deploy</text>
  </g>

  <text x="640" y="328" text-anchor="middle" font-family="monospace" font-size="104" font-weight="bold" fill="#6ee7b7" letter-spacing="2">ReWarMe</text>
  <text x="640" y="378" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#d1fae5">WAR redeploy on autopilot</text>
  <text x="640" y="414" text-anchor="middle" font-family="monospace" font-size="20" fill="#5eead4">stop → delete → copy → start · Java 8 · Swing · Maven</text>

  <g transform="translate(44,420)">
    <rect width="252" height="34" rx="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="126" y="22" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="1" fill="#a7f3d0">LEGACY · 2018</text>
  </g>
  <text x="1236" y="442" text-anchor="end" font-family="monospace" font-size="20" font-weight="bold" fill="#34d399">hmmaros</text>
</svg>