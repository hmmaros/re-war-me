<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="ReWarMe hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160f07"/>
      <stop offset="0.55" stop-color="#2b1a0b"/>
      <stop offset="1" stop-color="#3f2509"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fbbf24" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <circle cx="640" cy="170" r="150" fill="url(#glow)"/>

  <!-- icon: deploy box with cycle -->
  <g transform="translate(640,170)">
    <path d="M -34 -30 A 60 60 0 0 1 30 -36" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 30 -36 L 34 -24 L 20 -30 Z" fill="#fbbf24"/>
    <path d="M 34 30 A 60 60 0 0 1 -30 36" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>
    <path d="M -30 36 L -34 24 L -20 30 Z" fill="#fb923c"/>
    <rect x="-58" y="-63" width="116" height="116" rx="18" fill="url(#box)" stroke="#fde68a" stroke-width="3"/>
    <text x="0" y="-6" text-anchor="middle" font-family="monospace" font-size="42" font-weight="bold" fill="#3a1d00">WAR</text>
    <text x="0" y="28" text-anchor="middle" font-family="monospace" font-size="16" fill="#7c3f00">.deploy</text>
  </g>

  <text x="640" y="330" text-anchor="middle" font-family="monospace" font-size="104" font-weight="bold" fill="#fcd34d" letter-spacing="2">ReWarMe</text>
  <text x="640" y="380" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#fef3c7">WAR redeploy on autopilot</text>
  <text x="640" y="415" text-anchor="middle" font-family="monospace" font-size="20" fill="#d9b27c">stop → delete → copy → start  ·  Java 8 · Swing · Maven</text>

  <g transform="translate(44,420)">
    <rect width="252" height="34" rx="17" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="126" y="22" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="1" fill="#fde68a">LEGACY · CIRCA 2018</text>
  </g>
  <text x="1236" y="442" text-anchor="end" font-family="monospace" font-size="15" fill="#8a5a16">part of the 2018 toolbox</text>
</svg>