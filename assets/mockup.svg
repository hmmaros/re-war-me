<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="ReWarMe main window mockup">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#e2e2e2"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" fill="url(#desk)"/>
  <circle cx="480" cy="36" r="90" fill="#34d399" fill-opacity="0.06"/>

  <!-- window shadow -->
  <rect x="128" y="112" width="720" height="320" rx="12" fill="#000" fill-opacity="0.5"/>
  <!-- window -->
  <rect x="120" y="100" width="720" height="320" rx="12" fill="#29282b" stroke="#4b4b52"/>
  <rect x="120" y="100" width="720" height="38" rx="12" fill="url(#titlebar)"/>
  <rect x="120" y="126" width="720" height="12" fill="url(#titlebar)"/>
  <circle cx="150" cy="119" r="6" fill="#34d399"/>
  <text x="480" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#cbd5e1">ReWarMe - app.war</text>

  <!-- content: light Swing (Metal) backend -->
  <rect x="120" y="138" width="720" height="282" fill="#e8e6e3"/>

  <!-- row 1: tomcat directory -->
  <text x="150" y="185" font-family="sans-serif" font-size="13" fill="#3f3f3f">Tomcat root directory</text>
  <rect x="150" y="158" width="430" height="26" fill="#ffffff" stroke="#9ca3af"/>
  <text x="157" y="176" font-family="sans-serif" font-size="13" fill="#7d7d7d">C:\apache-tomcat-9.0.12</text>
  <rect x="596" y="158" width="92" height="26" rx="3" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="642" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">Browse</text>
  <path d="M 150 190 h 538" stroke="#d4d2cf"/>

  <!-- row 2: project target -->
  <text x="150" y="227" font-family="sans-serif" font-size="13" fill="#3f3f3f">Directory of the file (e.g. /project/target)</text>
  <rect x="150" y="200" width="430" height="26" fill="#ffffff" stroke="#9ca3af"/>
  <text x="157" y="218" font-family="sans-serif" font-size="13" fill="#7d7d7d">C:\work\webapp\target</text>
  <rect x="596" y="200" width="92" height="26" rx="3" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="642" y="217" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">Browse</text>
  <path d="M 150 232 h 538" stroke="#d4d2cf"/>

  <!-- row 3: checkbox -->
  <rect x="150" y="248" width="14" height="14" rx="2" fill="#ffffff" stroke="#6b7280"/>
  <path d="M 152 253 l 4 4 l 7 -7" fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="172" y="260" font-family="sans-serif" font-size="12.5" fill="#333">Do not restart Tomcat for every .war update</text>

  <!-- row 4: port -->
  <text x="150" y="306" font-family="sans-serif" font-size="13" fill="#3f3f3f">Your tomcat port is:</text>
  <rect x="300" y="294" width="58" height="24" fill="#ef4444" stroke="#8a1c1c"/>
  <text x="329" y="311" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1a0d0d">8080</text>
  <rect x="376" y="296" width="14" height="14" rx="2" fill="#ffffff" stroke="#6b7280"/>
  <text x="398" y="309" font-family="sans-serif" font-size="12.5" fill="#333">Be sure that the port is the right one and accept it</text>

  <!-- status -->
  <text x="712" y="309" text-anchor="end" font-family="monospace" font-size="13" font-style="italic" fill="#2563eb">Running . . .</text>

  <!-- buttons -->
  <rect x="150" y="338" width="96" height="30" rx="4" fill="#c3c0bc" stroke="#8f8d89"/>
  <text x="198" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Start</text>
  <rect x="258" y="338" width="96" height="30" rx="4" fill="url(#btn)" stroke="#8f8d89"/>
  <text x="306" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">Stop</text>

  <text x="816" y="390" text-anchor="end" font-family="sans-serif" font-size="12" fill="#8d8a86">© DC v0.9</text>

  <text x="480" y="452" text-anchor="middle" font-family="monospace" font-size="14" fill="#9ca3af">ReWarMe v0.9 — main window (widgets drawn from source; app requires MS Windows)</text>
</svg>